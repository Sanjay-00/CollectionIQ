name: Tests

# Every push (any branch) and every PR into main runs the full suite. All 380+
# tests are pure pandas/business-logic with zero live Gemini calls (verified:
# the suite passes with GOOGLE_API_KEY unset entirely), so this job needs no
# secrets at all.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
